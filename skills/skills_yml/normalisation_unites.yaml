id: normalisation_unites
objectif: Normaliser les valeurs et unités chantier pour calculs de temps.
inputs:
  - donnees_extraites
regles:
  - "Unités autorisées: m, ml, m2, h"
  - "longueur -> ml"
  - "hauteur, largeur -> m"
  - "surface -> m2"
  - "durée -> h"
  - "Convertir virgule décimale en point (ex: 2,50 -> 2.50)"
  - "Si unité absente mais évidente, normaliser; sinon null + alerte"
  - "Interdire unités non reconnues sans conversion explicite"
output_json:
  longueur_ml: "number|null"
  hauteur_m: "number|null"
  largeur_m: "number|null"
  surface_m2: "number|null"
  duree_h: "number|null"
  nb_faces: "number|null"
  valeurs_normalisees: ["string"]
  alertes_unites: ["string"]