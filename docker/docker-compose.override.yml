# Surcharges locales — ce fichier est appliqué automatiquement par docker compose.
# Adapter selon votre environnement (GPU, ports, bind mounts, etc.)
# NE PAS versionner si des secrets y apparaissent.

services:

  ollama:
    gpus: all

    # Exemple : exposer l'API Ollama sur le réseau local
    # ports:
    #   - "${OLLAMA_PORT:-11434}:11434"

    # Aucune surcharge active par defaut.
    # Decommentez les blocs ci-dessus selon vos besoins.

  openwebui:
    # Bind mounts locaux: toute modification dans le repo est visible dans le conteneur.
    volumes:
      - ../openwebui/knowledge:/app/backend/data/knowledge
      - ../openwebui/live/tools:/app/backend/data/tools
      - ../openwebui/pipelines:/app/backend/data/pipelines
      - ../openwebui/live/skills:/app/backend/data/skills
