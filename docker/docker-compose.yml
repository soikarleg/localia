services:

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_net
    # Décommentez les lignes suivantes pour activer le GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  openwebui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_IMAGE_TAG:-0.10.6}
    container_name: openwebui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-changeme}
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - ai_net

volumes:
  ollama_data:
    name: ollama_data
  openwebui_data:
    name: openwebui_data

networks:
  ai_net:
    name: ai_net
